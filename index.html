<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaceBuild – Training Program Planner</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-4 sm:px-6 lg:px-8 font-sans text-slate-900">

    <div class="max-w-7xl mx-auto">
        <!-- Header with RaceBuild Logo -->
        <header class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between border-b border-slate-200 pb-5 gap-4">
            <div class="flex items-center gap-3">
                <!-- Inline SVG Logo for RaceBuild -->
                <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-100 flex items-center justify-center">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Structural Sporty 'R' with speed dashes -->
                        <path d="M4 21V3H12C15 3 17.5 5.5 17.5 8.5C17.5 11.5 15 14 12 14H4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10.5 14L17 21" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 7.5H11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M7 10.5H9.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-slate-800">Race<span class="text-indigo-600">Build</span></h1>
                    <p class="text-xs text-slate-500 font-semibold tracking-wide uppercase">Training Program Planner</p>
                </div>
            </div>
            
            <!-- Jump, Sync, & Navigation Controls -->
            <div class="flex flex-wrap items-center gap-3">
                <!-- Backup & Restore Buttons -->
                <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-1 shadow-sm">
                    <button id="export-btn" class="px-2.5 py-1 text-xs font-semibold text-slate-600 hover:text-indigo-600 rounded hover:bg-slate-50 transition" title="Save your training data to a file">Export Backup</button>
                    <span class="text-slate-200">|</span>
                    <button id="import-btn" class="px-2.5 py-1 text-xs font-semibold text-slate-600 hover:text-indigo-600 rounded hover:bg-slate-50 transition" title="Load your training data from a file">Import Backup</button>
                    <input type="file" id="import-file-input" class="hidden" accept=".json">
                </div>

                <div class="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-1 shadow-sm">
                    <button id="prev-week-btn" class="px-3 py-1.5 text-sm font-medium hover:bg-slate-100 rounded-md transition">&larr; Prev 2 Weeks</button>
                    <button id="today-btn" class="px-3 py-1.5 text-sm font-medium hover:bg-slate-100 rounded-md transition">Today</button>
                    <button id="next-week-btn" class="px-3 py-1.5 text-sm font-medium hover:bg-slate-100 rounded-md transition">Next 2 Weeks &rarr;</button>
                </div>
                
                <div class="flex items-center gap-2">
                    <label for="jump-date" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Jump to:</label>
                    <input type="date" id="jump-date" class="border border-slate-200 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
        </header>

        <!-- Week 1 Section -->
        <div class="mb-8">
            <h2 id="week1-heading" class="text-lg font-bold text-indigo-600 mb-3">Week 1...</h2>
            <div class="grid grid-cols-1 md:grid-cols-7 gap-4" id="week1-grid">
                <!-- Day Cards dynamically inserted here -->
            </div>
        </div>

        <!-- Week 2 Section -->
        <div class="mb-8">
            <h2 id="week2-heading" class="text-lg font-bold text-indigo-600 mb-3">Week 2...</h2>
            <div class="grid grid-cols-1 md:grid-cols-7 gap-4" id="week2-grid">
                <!-- Day Cards dynamically inserted here -->
            </div>
        </div>
    </div>

    <!-- Edit Day Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full overflow-hidden transform transition-all">
            <!-- Modal Header -->
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modal-date-label" class="font-bold text-slate-800 text-lg">Edit Plan</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            
            <!-- Modal Form -->
            <form id="plan-form" class="p-6 space-y-4">
                <input type="hidden" id="modal-date-val">
                
                <!-- Session Type Selection -->
                <div>
                    <label for="session-type" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Session Type</label>
                    <select id="session-type" class="w-full border border-slate-200 rounded-lg p-2 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">-- No Session Scheduled --</option>
                        <option value="Rest Day">Rest Day</option>
                        <option value="Threshold Run">Threshold Run</option>
                        <option value="Metcon">Metcon</option>
                        <option value="VO2 Max">VO2 Max</option>
                        <option value="Hill Sprints">Hill Sprints</option>
                        <option value="Recovery Run">Recovery Run</option>
                        <option value="Long Run">Long Run</option>
                        <option value="Easy Aerobic">Easy Aerobic</option>
                        <option value="Upper Strength">Upper Strength</option>
                        <option value="Lower Strength">Lower Strength</option>
                        <option value="Full Body Strength">Full Body Strength</option>
                        <option value="Race Day">Race Day</option>
                    </select>
                </div>

                <!-- Session Details -->
                <div>
                    <label for="session-details" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Session Details (Plan)</label>
                    <textarea id="session-details" rows="4" placeholder="e.g., 5x1000m intervals at 4:00/km pace with 90s recovery..." class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <!-- Results & Comments -->
                <div>
                    <label for="session-results" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Results & Comments (Execution)</label>
                    <textarea id="session-results" rows="3" placeholder="e.g., Hit target paces. Heart rate peaked at 178 bpm. Felt strong on reps 3 and 4." class="w-full border border-slate-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <!-- Actions -->
                <div class="flex justify-end gap-3 pt-2 border-t border-slate-100">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Color mapping based on Session Type
        const typeColors = {
            "Rest Day": "bg-slate-100 text-slate-700 border-slate-200",
            "Threshold Run": "bg-amber-50 text-amber-800 border-amber-200",
            "Metcon": "bg-purple-50 text-purple-800 border-purple-200",
            "VO2 Max": "bg-rose-50 text-rose-800 border-rose-200",
            "Hill Sprints": "bg-pink-50 text-pink-800 border-pink-200",
            "Recovery Run": "bg-emerald-50 text-emerald-800 border-emerald-200",
            "Long Run": "bg-sky-50 text-sky-800 border-sky-200",
            "Easy Aerobic": "bg-teal-50 text-teal-800 border-teal-200",
            "Upper Strength": "bg-blue-50 text-blue-800 border-blue-200",
            "Lower Strength": "bg-indigo-50 text-indigo-800 border-indigo-200",
            "Full Body Strength": "bg-violet-50 text-violet-800 border-violet-200",
            "Race Day": "bg-red-50 text-red-800 border-red-200 font-bold"
        };

        const defaultColor = "bg-white text-slate-400 border-slate-200";

        // Main State
        let currentMonday = getMonday(new Date());
        let trainingPlans = JSON.parse(localStorage.getItem('trainingPlans')) || {};

        // --- SILENT MIGRATION SCRIPT ---
        const migrationMap = {
            "rest day": "Rest Day",
            "threshold run": "Threshold Run",
            "metcon": "Metcon",
            "vo2 max": "VO2 Max",
            "hill sprints": "Hill Sprints",
            "recovery run": "Recovery Run",
            "long run": "Long Run"
        };
        let dataMigrated = false;
        for (let dayKey in trainingPlans) {
            if (trainingPlans[dayKey] && trainingPlans[dayKey].type) {
                const oldTypeLower = trainingPlans[dayKey].type.toLowerCase();
                if (migrationMap[oldTypeLower] && trainingPlans[dayKey].type !== migrationMap[oldTypeLower]) {
                    trainingPlans[dayKey].type = migrationMap[oldTypeLower];
                    dataMigrated = true;
                }
            }
        }
        if (dataMigrated) {
            localStorage.setItem('trainingPlans', JSON.stringify(trainingPlans));
        }
        // -------------------------------

        // DOM Elements
        const week1Grid = document.getElementById('week1-grid');
        const week2Grid = document.getElementById('week2-grid');
        const week1Heading = document.getElementById('week1-heading');
        const week2Heading = document.getElementById('week2-heading');
        
        const prevWeekBtn = document.getElementById('prev-week-btn');
        const nextWeekBtn = document.getElementById('next-week-btn');
        const todayBtn = document.getElementById('today-btn');
        const jumpDateInput = document.getElementById('jump-date');

        // Sync Buttons
        const exportBtn = document.getElementById('export-btn');
        const importBtn = document.getElementById('import-btn');
        const importFileInput = document.getElementById('import-file-input');

        // Modal Elements
        const modalBackdrop = document.getElementById('modal-backdrop');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelModalBtn = document.getElementById('cancel-modal-btn');
        const planForm = document.getElementById('plan-form');
        const modalDateLabel = document.getElementById('modal-date-label');
        const modalDateVal = document.getElementById('modal-date-val');
        const sessionTypeSelect = document.getElementById('session-type');
        const sessionDetailsText = document.getElementById('session-details');
        const sessionResultsText = document.getElementById('session-results');

        // Date Helpers
        function getMonday(d) {
            d = new Date(d);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Adjust for Sunday
            return new Date(d.setDate(diff));
        }

        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function formatDateKey(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function formatDisplayDate(date) {
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            return date.toLocaleDateString(undefined, options);
        }

        // Helper to populate individual weekly grids
        function populateGrid(gridElement, startOfWeekDate) {
            gridElement.innerHTML = '';
            
            for (let i = 0; i < 7; i++) {
                const dayDate = addDays(startOfWeekDate, i);
                const dayKey = formatDateKey(dayDate);
                const dayData = trainingPlans[dayKey] || { type: '', details: '', results: '' };
                const isToday = formatDateKey(new Date()) === dayKey;

                // Build Card
                const card = document.createElement('div');
                card.className = `flex flex-col bg-white rounded-xl border p-4 shadow-sm hover:shadow-md transition cursor-pointer min-h-[220px] ${isToday ? 'ring-2 ring-indigo-500 border-indigo-200' : 'border-slate-200'}`;
                card.setAttribute('onclick', `openEditModal('${dayKey}')`);

                // Card Header (Day & Date)
                let headerHTML = `
                    <div class="flex justify-between items-baseline mb-2">
                        <span class="font-bold text-sm ${isToday ? 'text-indigo-600' : 'text-slate-700'}">${formatDisplayDate(dayDate)}</span>
                        ${isToday ? '<span class="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-bold uppercase tracking-wide">Today</span>' : ''}
                    </div>
                `;

                // Badge for Session Type
                let badgeHTML = '';
                if (dayData.type) {
                    const colorClass = typeColors[dayData.type] || defaultColor;
                    badgeHTML = `<span class="inline-block text-xs font-bold border px-2 py-0.5 rounded-full mb-3 w-fit ${colorClass}">${dayData.type}</span>`;
                } else {
                    badgeHTML = `<span class="inline-block text-xs font-semibold text-slate-300 border border-dashed border-slate-200 px-2 py-0.5 rounded-full mb-3 w-fit">Rest/Planned Off</span>`;
                }

                // Details Preview
                let detailsHTML = `<p class="text-xs text-slate-500 line-clamp-3 mb-4 flex-grow">${dayData.details ? escapeHTML(dayData.details) : 'No plan details added yet.'}</p>`;

                // Bottom Indicator if execution comments exist
                let footerHTML = '';
                if (dayData.results) {
                    footerHTML = `
                        <div class="mt-auto pt-2 border-t border-slate-100 flex items-center gap-1.5 text-xs text-emerald-600 font-semibold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                            Log entered
                        </div>
                    `;
                } else {
                    footerHTML = `
                        <div class="mt-auto pt-2 border-t border-slate-50 flex items-center gap-1.5 text-xs text-slate-300">
                            No log details
                        </div>
                    `;
                }

                card.innerHTML = headerHTML + badgeHTML + detailsHTML + footerHTML;
                gridElement.appendChild(card);
            }
        }

        // Render both Week 1 and Week 2
        function renderWeeks() {
            const week1Start = new Date(currentMonday);
            const week1End = addDays(week1Start, 6);

            const week2Start = addDays(week1Start, 7);
            const week2End = addDays(week1Start, 13);

            // Update Week 1 Heading
            week1Heading.textContent = `Week 1: ${week1Start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${week1End.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
            
            // Update Week 2 Heading
            week2Heading.textContent = `Week 2: ${week2Start.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${week2End.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}`;
            
            // Render Grids
            populateGrid(week1Grid, week1Start);
            populateGrid(week2Grid, week2Start);
        }

        // Modal Operations
        window.openEditModal = function(dayKey) {
            const dayDate = new Date(dayKey + 'T00:00:00'); // Prevent timezone offset errors
            const dayData = trainingPlans[dayKey] || { type: '', details: '', results: '' };

            modalDateLabel.textContent = dayDate.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            modalDateVal.value = dayKey;
            sessionTypeSelect.value = dayData.type;
            sessionDetailsText.value = dayData.details;
            sessionResultsText.value = dayData.results;

            modalBackdrop.classList.remove('hidden');
        };

        function closeModal() {
            modalBackdrop.classList.add('hidden');
            planForm.reset();
        }

        // Form Submit
        planForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const dayKey = modalDateVal.value;
            const selectedType = sessionTypeSelect.value;
            const details = sessionDetailsText.value.trim();
            const results = sessionResultsText.value.trim();

            if (!selectedType && !details && !results) {
                delete trainingPlans[dayKey];
            } else {
                trainingPlans[dayKey] = {
                    type: selectedType,
                    details: details,
                    results: results
                };
            }

            localStorage.setItem('trainingPlans', JSON.stringify(trainingPlans));
            closeModal();
            renderWeeks();
        });

        // Export Training Data to JSON File
        exportBtn.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trainingPlans, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "training_schedule_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // Trigger file input click when clicking "Import Backup"
        importBtn.addEventListener('click', () => {
            importFileInput.click();
        });

        // Handle File Import
        importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const importedData = JSON.parse(evt.target.result);
                    if (typeof importedData === 'object' && importedData !== null) {
                        trainingPlans = importedData;
                        localStorage.setItem('trainingPlans', JSON.stringify(trainingPlans));
                        renderWeeks();
                        alert("Data successfully imported!");
                    } else {
                        alert("Invalid file structure.");
                    }
                } catch (err) {
                    alert("Error parsing file. Ensure it is a valid backup file.");
                }
            };
            reader.readAsText(file);
        });

        // Navigation Click Handlers (Shifting by 14 days / 2 weeks)
        prevWeekBtn.addEventListener('click', () => {
            currentMonday = addDays(currentMonday, -14);
            renderWeeks();
        });

        nextWeekBtn.addEventListener('click', () => {
            currentMonday = addDays(currentMonday, 14);
            renderWeeks();
        });

        todayBtn.addEventListener('click', () => {
            currentMonday = getMonday(new Date());
            renderWeeks();
        });

        jumpDateInput.addEventListener('change', (e) => {
            if (e.target.value) {
                currentMonday = getMonday(new Date(e.target.value + 'T00:00:00'));
                renderWeeks();
            }
        });

        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeModal();
        });

        // Helper to prevent XSS
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // Initial Run
        renderWeeks();
    </script>
</body>
</html>
